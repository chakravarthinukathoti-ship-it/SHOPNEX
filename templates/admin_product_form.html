{% extends 'base.html' %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product | SHOPNEX{% endblock %}
{% block content %}
<p class="eyebrow">STORE MANAGEMENT</p><h1 class="page-title">{{ 'Edit product' if product else 'Add a product' }}</h1>
<form class="form-card admin-form" method="post"><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Description<textarea name="description" rows="3" required>{{ product.description if product else '' }}</textarea></label><div class="admin-form-grid"><label>Price (₹)<input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input name="stock" type="number" min="0" step="1" required value="{{ product.stock if product else 10 }}"></label></div><label>Category<input name="category" required placeholder="Electronics, Fashion, Home & Living" value="{{ product.category if product else '' }}"></label><label>Image URL<input name="image" type="url" required value="{{ product.image if product else '' }}"></label><div class="admin-actions"><button class="button" type="submit">Save product</button><a class="button secondary" href="{{ url_for('admin_products') }}">Cancel</a></div></form>
{% endblock %}
